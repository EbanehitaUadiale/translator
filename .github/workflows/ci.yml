name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the project is developed against; 3.13 is the newest
        # Django 5.2 supports, so this catches deprecations early.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # No ANTHROPIC_API_KEY here on purpose. The suite patches the Anthropic
        # client throughout, so CI never makes a real API call or spends money;
        # if a test ever tries to, it should fail loudly rather than pass by
        # quietly reaching the network.
        run: python manage.py test --verbosity 2
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-tests
